<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración | TeamStyle</title><link rel="stylesheet" href="css/estilos.css"></head><body><header><a class="brand" href="index.html">TEAM<span>STYLE</span></a><nav><a href="index.html">Tienda</a><a href="catalogo.html">Catálogo</a><a href="admin.html">Administración</a></nav></header><main><p class="eyebrow">Gestión interna</p><h1>Pedidos recibidos</h1><p class="intro">Panel demostrativo para consultar solicitudes guardadas en SQLite.</p><div id="adminOrders"><p>Cargando pedidos…</p></div></main><footer>TEAMSTYLE · Administración didáctica</footer><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function loadOrders(){const root=document.getElementById('adminOrders');try{const orders=await (await fetch('/api/orders')).json();if(!orders.length){root.innerHTML='<div class="empty"><h2>Aún no hay pedidos</h2><p>Las solicitudes enviadas desde Personalización aparecerán aquí.</p></div>';return;}root.innerHTML=orders.map(o=>`<section class="panel"><span class="tag">Pedido #${o.id} · ${esc(o.status)}</span><h2>${esc(o.team)} — ${esc(o.sport)}</h2><p>Representante: ${esc(o.client)} · ${esc(o.email)} · ${esc(o.phone)}</p><p>Diseño: ${esc(o.design)} · Fecha: ${esc(o.createdAt)}</p><p>Colores: <span style="display:inline-block;background:${esc(o.baseColor)};width:18px;height:18px;border-radius:4px"></span> <span style="display:inline-block;background:${esc(o.detailColor)};width:18px;height:18px;border-radius:4px"></span></p><h3>Jugadores (${o.players.length})</h3><ul>${o.players.map(x=>`<li>${esc(x.name)} — #${esc(x.number)} — ${esc(x.size)}</li>`).join('')}</ul><p>Notas: ${esc(o.notes||'—')}</p><label>Estado del pedido <select id="s${o.id}">${['Recibido','En revisión','En producción','Entregado','Cancelado'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></label> <button onclick="changeStatus(${o.id})">Guardar estado</button> <button class="secondary" onclick="deleteOrder(${o.id})">Eliminar</button></section>`).join('');}catch(e){root.innerHTML='<p>No se pudo conectar con el servidor. Inicia TeamStyle con npm start.</p>';}}
async function changeStatus(id){const status=document.getElementById('s'+id).value;const r=await fetch('/api/orders/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});if(r.ok){alert('Estado actualizado');loadOrders()}else alert('No se pudo actualizar');}
async function deleteOrder(id){if(!confirm('¿Eliminar este pedido?'))return;const r=await fetch('/api/orders/'+id,{method:'DELETE'});if(r.ok)loadOrders();else alert('No se pudo eliminar');}loadOrders();
</script></body></html>
