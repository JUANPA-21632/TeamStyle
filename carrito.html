<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Mi pedido | TeamStyle</title>
    <link rel="stylesheet" href="css/estilos.css" />
  </head>
  <body>
    <header>
      <a class="brand" href="index.html">TEAM<span>STYLE</span></a>
      <nav>
        <a href="index.html">Inicio</a><a href="catalogo.html">Catálogo</a
        ><a href="personalizar.html">Personalizar</a
        ><a href="carrito.html">Mi pedido</a
        ><a href="contacto.html">Contacto</a>
      </nav>
    </header>
    <main>
      <p class="eyebrow">Antes de enviar</p>
      <h1>Mi pedido</h1>
      <div id="orders"></div>
    </main>
    <footer>TEAMSTYLE · Solicitud de pedido demostrativa</footer>
    <script>
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      async function render() {
        const el = document.getElementById("orders"),
          o = JSON.parse(localStorage.getItem("tsLastOrder") || "null");
        if (!o) {
          el.innerHTML =
            '<div class="empty"><h2>Aún no tienes solicitudes</h2><p>Elige un uniforme del catálogo para comenzar.</p><a class="btn" href="catalogo.html">Ir al catálogo</a></div>';
          return;
        }
        el.innerHTML = `<section class="panel"><span class="tag">Solicitud #${o.id}</span><h2>${esc(o.team)} · ${esc(o.sport)}</h2><p>Representante: ${esc(o.client)} · ${esc(o.email)}</p><p>Diseño: ${esc(o.design)}</p><p>Colores: <span style="display:inline-block;background:${esc(o.baseColor)};width:18px;height:18px;border-radius:4px"></span> <span style="display:inline-block;background:${esc(o.detailColor)};width:18px;height:18px;border-radius:4px"></span></p><h3>Jugadores (${o.players.length})</h3><ul>${o.players.map((p) => `<li>${esc(p.name)} — #${esc(p.number)} — talla ${esc(p.size)}</li>`).join("")}</ul><p>Notas: ${esc(o.notes || "Sin notas")}</p><p class="notice">Solicitud guardada en la base de datos. No se realizó ningún cobro.</p><button onclick="finish()">Confirmar solicitud</button></section>`;
      }
      function finish() {
        alert(
          "¡Solicitud de demostración confirmada! No se realizó ningún cobro. Puedes consultar el pedido desde Administración.",
        );
        localStorage.removeItem("tsLastOrder");
        location.href = "index.html";
      }
      render();
    </script>
  </body>
</html>
