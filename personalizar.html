<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalizar Uniforme - TeamStyle</title>

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <main class="contenedor">

        <h1 class="titulo-prsonalizar">Personalizar</h1>
        

        <a href="index.html" class="volver">← Volver al inicio</a>

        <form id="formulario">

            <div class="caja-formulario">
                <label for="equipo">Nombre del equipo:</label>
                <input type="text" id="equipo" required>
            </div>

            <div class="caja-formulario">
                <label for="deporte">Deporte:</label>
                <select id="deporte" required>
                    <option value="">Selecciona un deporte</option>
                    <option value="Fútbol">Fútbol</option>
                    <option value="Baloncesto">Baloncesto</option>
                    <option value="Voleibol">Voleibol</option>
                </select>
            </div>

            <div class="caja-formulario">
                <label for="color">Color del uniforme:</label>
                <input type="color" id="color" value="#00aaff">
            </div>

            <button type="submit">Enviar pedido</button>

        </form>

        <div id="mensaje"></div>

    </main>

    <script src="js/script.js"></script>

</body>
</html>
